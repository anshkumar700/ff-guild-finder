
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FF Guild Finder</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      background: #0b1020;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 520px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 18px 0;
    }

    header h1 {
      color: #ffb52e;
      margin: 0 0 8px;
    }

    .card {
      background: #161e31;
      border: 1px solid #293550;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 19px;
      margin-top: 0;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 9px;
      font-size: 15px;
    }

    input {
      color: white;
      background: #0b1020;
      border: 1px solid #34425f;
      outline: none;
    }

    button {
      border: 0;
      background: #ffb52e;
      color: #171717;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .google {
      background: white;
      color: #222;
    }

    .secondary {
      background: #273653;
      color: white;
    }

    .small {
      color: #b8c2d9;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .guild {
      background: #0e1628;
      border: 1px solid #34425f;
      padding: 13px;
      border-radius: 12px;
      margin-top: 12px;
    }

    .guild h3 {
      color: #ffb52e;
      margin: 0 0 10px;
    }

    .status {
      color: #ffcf70;
      font-size: 14px;
      line-height: 1.5;
    }

    .hidden { display: none; }

    footer {
      color: #9ca9c2;
      font-size: 12px;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>

<body>
<div class="app">

  <header>
    <h1>🔥 FF Guild Finder</h1>
    <p>Find guilds. Connect with players.</p>
  </header>

  <section class="card" id="loginCard">
    <h2>Google Login</h2>
    <p class="small">
      Apne Google account se sign in karo.
    </p>
    <button class="google" id="googleBtn">
      Continue with Google
    </button>
    <p id="loginStatus" class="status" role="status"></p>
  </section>

  <section class="card hidden" id="profileCard">
    <h2>Player Profile</h2>
    <p id="accountInfo" class="small"></p>
    <label for="nickname">Free Fire Nickname</label>
    <input id="nickname" maxlength="30"
           placeholder="Apna FF nickname likho">
    <button id="saveNickBtn">Save Nickname</button>
    <button id="logoutBtn" class="secondary">Logout</button>
    <p id="profileStatus" class="status" role="status"></p>
  </section>

  <section class="card hidden" id="createCard">
    <h2>➕ Add Your Guild</h2>

    <input id="guildName" maxlength="40"
           placeholder="Guild Name">

    <input id="guildId" maxlength="40"
           placeholder="Guild ID">

    <input id="leaderUid" maxlength="60"
           placeholder="Guild Leader UID">

    <input id="guildLevel" type="number"
           min="1" max="500" placeholder="Guild Level">

    <input id="memberCount" type="number"
           min="1" max="50" value="1"
           placeholder="Current members (1–50)">

    <button id="createBtn">Publish Guild</button>
    <p id="createStatus" class="status" role="status"></p>
  </section>

  <section class="card hidden" id="finderCard">
    <h2>🔎 Find a Guild</h2>
    <input id="searchBox"
           placeholder="Guild name ya Guild ID search karo">
    <button id="searchBtn" class="secondary">Search Guilds</button>
    <p class="small">
      Member count wahi dikhaya jayega jo database mein save hai.
    </p>
    <div id="guildList"></div>
    <p id="listStatus" class="status" role="status"></p>
  </section>

  <footer>
    FF Guild Finder · Unofficial community project.
    Not affiliated with Garena.
  </footer>

</div>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    limit,
    runTransaction,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

  // Tumhare Firebase project ki configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCG64twHNrhL3zzz9IZWCjQEWdrvdTXGCc",
    authDomain: "ff-guild-finder.firebaseapp.com",
    projectId: "ff-guild-finder",
    storageBucket: "ff-guild-finder.firebasestorage.app",
    messagingSenderId: "829159563717",
    appId: "1:829159563717:web:7ed38858eca43864c4abac",
    measurementId: "G-XKE25B2Q0K"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  provider.setCustomParameters({
    prompt: "select_account"
  });

  let currentUser = null;
  let currentNickname = "";
  let guildsCache = [];

  const $ = id => document.getElementById(id);

  function message(id, text) {
    $(id).textContent = text;
  }

  function show(id, visible) {
    $(id).classList.toggle("hidden", !visible);
  }

  function setBusy(buttonId, busy) {
    $(buttonId).disabled = busy;
  }

  function cleanText(value, max = 60) {
    return String(value || "").trim().slice(0, max);
  }

  // Google sign in
  $("googleBtn").addEventListener("click", async () => {
    setBusy("googleBtn", true);
    message("loginStatus", "Google account khul raha hai...");

    try {
      await signInWithPopup(auth, provider);
      message("loginStatus", "Login successful!");
    } catch (error) {
      console.error(error);
      message("loginStatus",
        "Login error: " + error.code +
        ". Authorized domain aur HTTPS check karo.");
    } finally {
      setBusy("googleBtn", false);
    }
  });

  // Authentication state
  onAuthStateChanged(auth, async user => {
    currentUser = user;
    show("loginCard", !user);
    show("profileCard", !!user);
    show("createCard", !!user);
    show("finderCard", !!user);

    if (!user) {
      currentNickname = "";
      guildsCache = [];
      $("guildList").replaceChildren();
      return;
    }

    $("accountInfo").textContent =
      "Signed in: " + (user.email || "Google user");

    try {
      const profileRef = doc(db, "users", user.uid);
      const profileSnap = await getDoc(profileRef);

      if (profileSnap.exists()) {
        currentNickname = profileSnap.data().nickname || "";
      } else {
        currentNickname = "";
      }

      $("nickname").value = currentNickname;
      await loadGuilds();
    } catch (error) {
      console.error(error);
      message("profileStatus",
        "Profile load nahi hua: " + error.code);
    }
  });

  // Save player nickname
  $("saveNickBtn").addEventListener("click", async () => {
    if (!currentUser) return;

    const nickname = cleanText($("nickname").value, 30);

    if (nickname.length < 2) {
      message("profileStatus", "Kam se kam 2 characters ka nickname likho.");
      return;
    }

    setBusy("saveNickBtn", true);

    try {
      await setDoc(
        doc(db, "users", currentUser.uid),
        {
          nickname,
          email: currentUser.email || "",
          updatedAt: serverTimestamp()
        },
        { merge: true }
      );

      currentNickname = nickname;
      message("profileStatus", "Nickname save ho gaya!");
    } catch (error) {
      console.error(error);
      message("profileStatus",
        "Save error: " + error.code +
        ". Firestore rules check karo.");
    } finally {
      setBusy("saveNickBtn", false);
    }
  });

  // Logout
  $("logoutBtn").addEventListener("click", async () => {
    try {
      await signOut(auth);
      message("loginStatus", "Logout ho gaya.");
    } catch (error) {
      message("profileStatus", "Logout error: " + error.code);
    }
  });

  // Publish guild
  $("createBtn").addEventListener("click", async () => {
    if (!currentUser) return;

    if (!currentNickname) {
      message("createStatus", "Pehle nickname save karo.");
      return;
    }

    const name = cleanText($("guildName").value, 40);
    const guildId = cleanText($("guildId").value, 40);
    const leaderUid = cleanText($("leaderUid").value, 60);
    const level = Number($("guildLevel").value);
    const members = Number($("memberCount").value);

    if (!name || !guildId || !leaderUid) {
      message("createStatus", "Saari guild details bharo.");
      return;
    }

    if (!Number.isInteger(level) || level < 1 || level > 500) {
      message("createStatus", "Guild level sahi enter karo.");
      return;
    }

    if (!Number.isInteger(members) || members < 1 || members > 50) {
      message("createStatus", "Members ki sankhya 1 se 50 honi chahiye.");
      return;
    }

    setBusy("createBtn", true);

    try {
      await addDoc(collection(db, "guilds"), {
        name,
        guildId,
        leaderUid,
        guildLevel: level,
        memberCount: members,
        maxMembers: 50,
        ownerUid: currentUser.uid,
        ownerNickname: currentNickname,
        createdAt: serverTimestamp()
      });

      $("guildName").value = "";
      $("guildId").value = "";
      $("leaderUid").value = "";
      $("guildLevel").value = "";
      $("memberCount").value = "1";

      message("createStatus", "Guild publish ho gayi!");
      await loadGuilds();
    } catch (error) {
      console.error(error);
      message("createStatus",
        "Publish error: " + error.code +
        ". Firestore database aur rules check karo.");
    } finally {
      setBusy("createBtn", false);
    }
  });

  // Load guilds
  async function loadGuilds() {
    message("listStatus", "Guilds load ho rahi hain...");

    try {
      const q = query(
        collection(db, "guilds"),
        orderBy("createdAt", "desc"),
        limit(100)
      );

      const snapshot = await getDocs(q);
      guildsCache = snapshot.docs.map(d => ({
        id: d.id,
        ...d.data()
      }));

      renderGuilds();
      message("listStatus",
        guildsCache.length
          ? guildsCache.length + " guild(s) found."
          : "Abhi koi guild publish nahi hui.");
    } catch (error) {
      console.error(error);
      message("listStatus",
        "Guild load error: " + error.code +
        ". Firestore rules check karo.");
    }
  }

  // Safe rendering: user-entered values are never inserted as HTML
  function renderGuilds() {
    const list = $("guildList");
    list.replaceChildren();

    const search = cleanText($("searchBox").value, 60).toLowerCase();

    const filtered = guildsCache.filter(g =>
      String(g.name || "").toLowerCase().includes(search) ||
      String(g.guildId || "").toLowerCase().includes(search)
    );

    for (const guild of filtered) {
      const card = document.createElement("div");
      card.className = "guild";

      const title = document.createElement("h3");
      title.textContent = "🔥 " + (guild.name || "Unnamed Guild");

      const details = document.createElement("p");
      details.className = "small";
      details.textContent =
        "Guild ID: " + (guild.guildId || "—") +
        "\nLeader UID: " + (guild.leaderUid || "—") +
        "\nGuild Level: " + (guild.guildLevel ?? "—") +
        "\nMembers: " + (guild.memberCount ?? 0) +
        "/" + (guild.maxMembers ?? 50);

      details.style.whiteSpace = "pre-line";
      card.append(title, details);

      const joinBtn = document.createElement("button");
      joinBtn.textContent = "Join Guild";
      joinBtn.className = "secondary";
      joinBtn.addEventListener("click", () => joinGuild(guild.id, joinBtn));

      card.append(joinBtn);
      list.append(card);
    }

    if (!filtered.length) {
      const empty = document.createElement("p");
      empty.className = "small";
      empty.textContent = "Koi matching guild nahi mili.";
      list.append(empty);
    }
  }

  $("searchBtn").addEventListener("click", renderGuilds);
  $("searchBox").addEventListener("input", renderGuilds);

  // Join guild with a Firestore transaction
  async function joinGuild(guildDocId, button) {
    if (!currentUser) return;

    if (!currentNickname) {
      message("listStatus", "Pehle apna nickname save karo.");
      return;
    }

    button.disabled = true;

    try {
      const membershipRef = doc(
        db, "guilds", guildDocId,
        "members", currentUser.uid
      );

      const guildRef = doc(db, "guilds", guildDocId);

      const result = await runTransaction(db, async transaction => {
        const membership = await transaction.get(membershipRef);
        const guild = await transaction.get(guildRef);

        if (!guild.exists()) throw new Error("GUILD_NOT_FOUND");
        if (membership.exists()) throw new Error("ALREADY_JOINED");

        const data = guild.data();
        const count = Number(data.memberCount || 0);
        const max = Number(data.maxMembers || 50);

        if (count >= max) throw new Error("GUILD_FULL");

        transaction.set(membershipRef, {
          uid: currentUser.uid,
          nickname: currentNickname,
          joinedAt: serverTimestamp()
        });

        transaction.update(guildRef, {
          memberCount: count + 1
        });

        return count + 1;
      });

      message("listStatus",
        "Guild join ho gayi! Members: " + result + "/50");
      await loadGuilds();
    } catch (error) {
      console.error(error);

      const errors = {
        ALREADY_JOINED: "Tum pehle se is guild ke member ho.",
        GUILD_FULL: "Guild full hai.",
        GUILD_NOT_FOUND: "Guild ab available nahi hai."
      };

      message("listStatus",
        errors[error.message] ||
        "Join error: " + (error.code || error.message));
    } finally {
      button.disabled = false;
    }
  }
</script>
</body>
</html>
